<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西川家記録｜旅のしおり & ヒストリー</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

<nav>
  <div class="nav-top">
    <div class="nav-brand">西川家記録</div>
  </div>
  <div class="nav-links">
    <button class="nav-btn active" data-nav="shiori" onclick="goto('shiori')">旅のしおり</button>
    <button class="nav-btn" data-nav="cleaning" onclick="goto('cleaning')">掃除当番</button>
    <button class="nav-btn" data-nav="kaji" onclick="goto('kaji')">家事当番</button>
    <button class="nav-btn" data-nav="history" onclick="goto('history')">ヒストリー</button>
  </div>
</nav>

<!-- ========== 旅のしおり ========== -->
<div id="shiori" class="page active">
<div class="container">
  <div class="trip-selbox">
    <select id="trip-year-sel"><option>読み込み中…</option></select>
    <select id="trip-sel"><option>読み込み中…</option></select>
  </div>
  <div class="hero" id="sh-hero"></div>
  <div class="stats-row" id="sh-stats"></div>
  <div class="card-section">
    <div class="sec-title" id="sch-anchor">スケジュール</div>
    <div class="day-tabs" id="sch-tabs"></div>
    <div id="sch-body"><div class="loading">読み込み中…</div></div>
  </div>
</div>
</div>

<!-- ========== 掃除当番 ========== -->
<div id="cleaning" class="page">
<div class="container">
  <div class="page-header"><h1>掃除当番</h1><p>担当・頻度・実施状況</p></div>
  <div class="clean-grid" id="clean-grid"><div class="loading">読み込み中…</div></div>
</div>
</div>

<!-- ========== 家事当番 ========== -->
<div id="kaji" class="page">
<div class="container">
  <div class="page-header"><h1>家事当番</h1><p>買い物・料理・ゴミ出しなど、日々の家事</p></div>
  <div class="kaji-grid" id="kaji-grid"><div class="loading">読み込み中…</div></div>
</div>
</div>

<!-- ========== ヒストリー ========== -->
<div id="history" class="page">
<div class="container">
  <div class="page-header"><h1>ヒストリー</h1><p>これまでの記録</p></div>
  <div id="hist-list"><div class="loading">読み込み中…</div></div>
</div>
</div>

<footer class="foot">
  西川家記録<br>
  データはGoogleスプレッドシートから取得しています。
</footer>

<script src="app.js"></script>
</body>
</html>
