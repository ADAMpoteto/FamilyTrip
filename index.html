<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西川家記録｜旅のしおり & ヒストリー</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

<nav>
  <div class="nav-top">
    <div class="nav-brand">西川家記録</div>
  </div>
  <div class="nav-links">
    <button class="nav-btn active" data-nav="shiori" onclick="goto('shiori')">旅のしおり</button>
    <button class="nav-btn" data-nav="cleaning" onclick="goto('cleaning')">掃除当番</button>
    <button class="nav-btn" data-nav="kaji" onclick="goto('kaji')">家事当番</button>
    <button class="nav-btn" data-nav="keiken" onclick="goto('keiken')">経県値</button>
    <button class="nav-btn" data-nav="history" onclick="goto('history')">ヒストリー</button>
  </div>
</nav>

<!-- ========== 旅のしおり ========== -->
<div id="shiori" class="page active">
<div class="container">
  <div class="trip-selbox">
    <select id="trip-year-sel"><option>読み込み中…</option></select>
    <select id="trip-sel"><option>読み込み中…</option></select>
  </div>
  <div class="hero" id="sh-hero"></div>
  <div class="stats-row" id="sh-stats"></div>
  <div class="card-section">
    <div class="sec-title" id="sch-anchor">スケジュール</div>
    <div class="day-tabs" id="sch-tabs"></div>
    <div id="sch-body"><div class="loading">読み込み中…</div></div>
  </div>
</div>
</div>

<!-- ========== 掃除当番 ========== -->
<div id="cleaning" class="page">
<div class="container">
  <div class="page-header"><h1>掃除当番</h1><p>担当・頻度・実施状況</p></div>
  <div class="clean-grid" id="clean-grid"><div class="loading">読み込み中…</div></div>
</div>
</div>

<!-- ========== 家事当番 ========== -->
<div id="kaji" class="page">
<div class="container">
  <div class="page-header"><h1>家事当番</h1><p>買い物・料理・ゴミ出しなど、日々の家事</p></div>
  <div class="kaji-grid" id="kaji-grid"><div class="loading">読み込み中…</div></div>
</div>
</div>

<!-- ========== 経県値マップ ========== -->
<div id="keiken" class="page">
<div class="container">
  <div class="page-header"><h1>経県値マップ</h1><p>日本の市区町村、どこまで行った？</p></div>

  <div class="card-section">
    <div class="sec-title">全国</div>
    <div class="stats-row" id="kk-nation-stats"></div>
    <div id="kk-nation"><div class="loading">読み込み中…</div></div>
    <div class="kk-note" id="kk-note" hidden></div>
  </div>

  <div class="card-section">
    <div class="sec-title" id="kk-pref-anchor">都道府県</div>
    <div class="trip-selbox"><select id="kk-pref-sel" aria-label="都道府県を選ぶ"></select></div>
    <div class="stats-row" id="kk-stats"></div>
    <div class="kk-legend" id="kk-legend" role="group" aria-label="レベルで絞り込む"></div>
    <div class="kk-mapwrap" id="kk-mapwrap">
      <div class="kk-ctrl" role="group" aria-label="地図の拡大・縮小">
        <button type="button" data-z="in" aria-label="拡大" title="拡大">＋</button>
        <button type="button" data-z="out" aria-label="縮小" title="縮小">－</button>
        <button type="button" data-z="home" aria-label="元の表示に戻す" title="元の表示に戻す">⟲</button>
      </div>
      <div class="kk-map" id="kk-map"><div class="loading">読み込み中…</div></div>
      <div class="kk-tip" id="kk-tip" hidden></div>
    </div>
    <div class="kk-info" id="kk-info" aria-live="polite"><p class="kk-info-empty">地図の市区町村をタップすると、ここに記録が表示されます。</p></div>
    <div class="kk-sub">市区町村の一覧</div>
    <div id="kk-list"></div>
  </div>
</div>
</div>

<!-- ========== ヒストリー ========== -->
<div id="history" class="page">
<div class="container">
  <div class="page-header"><h1>ヒストリー</h1><p>これまでの記録</p></div>
  <div id="hist-list"><div class="loading">読み込み中…</div></div>
</div>
</div>

<footer class="foot">
  西川家記録<br>
  データはGoogleスプレッドシートから取得しています。
</footer>

<script src="app.js"></script>
</body>
</html>
